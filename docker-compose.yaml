services:
  # ─── MODEL SERVING ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: indicode-ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=1           # no concurrent inference
      - OLLAMA_KEEP_ALIVE=10m           # model stays warm 10 min after last use
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      - ./volumes/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - sovereign
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── LLM GATEWAY ───────────────────────────────────────────────
  litellm:
    build: ./services/litellm
    container_name: indicode-litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]

    depends_on:
      ollama:
        condition: service_healthy

    networks:
      - sovereign

    ports:
      - "127.0.0.1:4000:4000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveness')"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # ─── OBSERVABILITY: OTEL COLLECTOR ────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: indicode-otel
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml
    environment:
      - LANGFUSE_BASIC_AUTH=${LANGFUSE_BASIC_AUTH}
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    command: ["--config", "/etc/otelcol/config.yaml"]
    networks:
      - sovereign
      - edge

  # ─── OBSERVABILITY: LOGS (LOKI + PROMTAIL) ────────────────────
  loki:
    image: grafana/loki:3.2.2
    container_name: indicode-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    networks:
      - sovereign

  promtail:
    image: grafana/promtail:3.2.2
    container_name: indicode-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yml:/etc/promtail/config.yml
    command: ["-config.file=/etc/promtail/config.yml"]
    networks:
      - sovereign

  # ─── SOVEREIGNTY PROOF: FALCO (eBPF) ──────────────────────────
  falco:
    image: falcosecurity/falco:0.39.1
    container_name: indicode-falco
    privileged: true
    environment:
      - FALCO_DRIVER_LOADER=yes
      - FALCO_DRIVER_KIND=modern_ebpf
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev
      - /sys:/sys:ro
      - ./falco/rules.yaml:/etc/falco/falco_rules.local.yaml
      - ./falco/output:/var/log/falco
    networks:
      - sovereign

  # ─── SOVEREIGNTY PROOF: TCPDUMP (flow capture) ────────────────
  tcpdump:
    image: corfr/tcpdump:latest
    container_name: indicode-tcpdump
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./falco/pcap:/data
    command: ["-i", "docker0", "-w", "/data/sovereign.pcap", "-U", "-v"]

  # ─── EDGE: NGINX REVERSE PROXY (single published port) ────────
  nginx:
    image: nginx:alpine
    container_name: indicode-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - dashboard
    networks:
      - sovereign
      - edge

  # ─── DASHBOARD (placeholder for Phase 1; full version in Phase 6)
  dashboard:
    build: ./dashboard
    container_name: indicode-dashboard
    networks:
      - sovereign
      - edge
  
  # DOCLING
  docling:
    build: ./services/docling
    container_name: indicode-docling

    volumes:
      - ./workspace:/workspace
      - ./volumes/docling-cache:/cache

    networks:
      - sovereign

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # QDrant Vector DB
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: indicode-qdrant
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    networks:
      - sovereign

  # RAG
  rag:
    build: ./services/rag
    container_name: indicode-rag

    volumes:
      - ./workspace:/workspace
      - ./volumes/docling-cache:/cache:ro

    depends_on:
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_started
      docling:
        condition: service_healthy

    networks:
      - sovereign

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  # ─── AGENT: LangGraph orchestrator ────────────────────────
  agent:
    build: ./services/agent
    container_name: indicode-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspace:/workspace
      - ./tests:/tests:ro
    depends_on:
      litellm:
        condition: service_healthy
      rag:
        condition: service_healthy
      docling:
        condition: service_healthy
    networks:
      - sovereign
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  loki-data:

networks:
  sovereign:
    internal: false      # ← Phase 1 Step 5: open for image pulls
    name: indicode-sovereign
  edge:
    internal: false
    name: indicode-edge
