events {
    worker_connections 1024;
}

http {
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header X-Frame-Options "ALLOWALL" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 80;

        # Serve Langfuse static assets.
        location /_next/ {
            proxy_pass http://langfuse-web:3000/_next/;
            proxy_http_version 1.1;
        }

        location = /icon.svg {
            proxy_pass http://langfuse-web:3000/icon.svg;
            proxy_http_version 1.1;
        }

        # Proxy Langfuse UI and API requests.
        location /langfuse/ {
            proxy_pass http://langfuse-web:3000/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /langfuse;
        }

        # Langfuse authentication can generate root-relative NextAuth URLs.
        location = /api/auth {
            proxy_pass http://langfuse-web:3000/api/auth;
            proxy_http_version 1.1;
        }

        location /api/auth/ {
            proxy_pass http://langfuse-web:3000/api/auth/;
            proxy_http_version 1.1;
        }

        location /auth/ {
            proxy_pass http://langfuse-web:3000/auth/;
            proxy_http_version 1.1;
        }

        # Langfuse frontend API requests are root-relative. The more specific
        # /api/agent/ location below continues to serve the Indicode agent.
        location = /api {
            proxy_pass http://langfuse-web:3000/api;
            proxy_http_version 1.1;
        }

        location /api/ {
            proxy_pass http://langfuse-web:3000/api/;
            proxy_http_version 1.1;
        }


        # Proxy the dashboard.
        location / {
            proxy_pass http://dashboard:8501/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Proxy the agent API and preserve streaming responses.
        location /api/agent/ {
            proxy_pass http://agent:8003/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;          # critical for SSE streaming
            proxy_read_timeout 600s;      # agent calls can be slow
            proxy_cache off;
        }
    }
}