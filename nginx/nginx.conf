events {
    worker_connections 1024;
}

http {
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header X-Frame-Options "ALLOWALL" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 80;

        # Langfuse static assets
        location /_next/ {
            proxy_pass http://langfuse-web:3000/_next/;
            proxy_http_version 1.1;
        }

        location = /icon.svg {
            proxy_pass http://langfuse-web:3000/icon.svg;
            proxy_http_version 1.1;
        }

        # Langfuse UI + API
        location /langfuse/ {
            proxy_pass http://langfuse-web:3000/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /langfuse;
        }

        # Loki API
        location /loki/ {
            proxy_pass http://loki:3100/;
        }

        # Streamlit dashboard
        location / {
            proxy_pass http://dashboard:8501/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}